<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIVIA GAME</title>
    <link rel="stylesheet" href="sytle.css">
</head>
<body>

    <div class="container">
        <h1> Trivia Game</h1>
        <button id="startBtn">Empezar Juego</button>

        <div id="game" class="hidden">
            <h2 id="question"></h2>
            <div id="answers"></div>
            <p id="score"></p>
            <button id="nextBtn" class="hidden">Siguiente</button>
            <button id="restartBtn" class="hidden">Jugar de nuevo</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
